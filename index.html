<style>

</style>

<div id="auth" hidden>

    </form>
    <p id="auth-msg"></p>

  </div>
</div>

    <p id="pay-modal-copy"></p>
    <label class="campo">Valor pago (R$)<input id="pay-modal-value" inputmode="decimal" autocomplete="off"></label>
    <div class="modal-actions"><button class="btn ghost" type="button" id="pay-cancel">Cancelar</button><button class="btn" type="button" id="pay-confirm">Confirmar</button></div>
  </div>
</div>

<script>
const KEY='contas-casal-basico-v1';
const vazio={salario:0,esposa:0,saldo:0,contas:[],dividas:[],ifood:[],historico:[],mesAtual:'',descontos:{},perfil:{voce:{nome:'Você',foto:''},esposa:{nome:'Sua esposa',foto:''}}};
let db=load();
let armado=false;
let aba='home';

function load(){
  try{const s=localStorage.getItem(KEY); if(s) return Object.assign({},JSON.parse(JSON.stringify(vazio)),JSON.parse(s));}catch(e){}
  return JSON.parse(JSON.stringify(vazio));
}
async function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
  if(window.__supabaseUser && window.__supabaseClient){
    const {error}=await window.__supabaseClient.from('couple_finance_data').upsert({id:'shared',data:db,updated_at:new Date().toISOString(),updated_by:window.__supabaseUser.id});
    if(error) console.error(error);
  }
}
function num(v){
  let s=String(v||'').trim();
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}
function brl(n){return 'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function brasiliaPartes(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o={};p.forEach(x=>{if(x.type!=='literal')o[x.type]=x.value;});return o;}
function hoje(){const p=brasiliaPartes();return `${p.year}-${p.month}-${p.day}`;}
function mesAtual(){return hoje().slice(0,7);}
function diaHoje(){return Number(brasiliaPartes().day);}
function diasNoMes(ano,mes){return new Date(Date.UTC(Number(ano),Number(mes),0)).getUTCDate();}
function diaVencimento(dia){const p=brasiliaPartes();return Math.min(diaValido(dia),diasNoMes(p.year,p.month));}
function diaValido(v){const n=parseInt(v,10);return n>=1&&n<=31?n:1;}
function dataBR(s){const p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function prazo(dia){const diff=diaVencimento(dia)-diaHoje();if(diff<0)return `Vencida há ${Math.abs(diff)} ${Math.abs(diff)===1?'dia':'dias'}`;if(diff===0)return 'Vence hoje';if(diff===1)return 'Vence amanhã';return `Vence em ${diff} dias`;}
function classePrazo(dia){const diff=diaVencimento(dia)-diaHoje();if(diff<0)return 'bad';if(diff<=1)return 'warn';if(diff<=7)return 'warn';return 'neu';}

function ordenarItens(lista){return lista.slice().sort((a,b)=>{if(!!a.paga!==!!b.paga)return a.paga?1:-1;const da=diaVencimento(a.dia)-diaHoje(),dbb=diaVencimento(b.dia)-diaHoje();return da-dbb||String(a.nome).localeCompare(String(b.nome),'pt-BR');});}
function itens(){
  return ordenarItens([
    ...db.contas.map(c=>({kind:'conta',id:c.id,nome:c.nome,valor:c.valor,valorPago:c.valorPago,juros:c.juros,dia:c.dia,paga:!!c.paga})),
    ...db.dividas.map(d=>({kind:'divida',id:d.id,nome:d.nome,valor:d.parcela,valorPago:d.valorPago,juros:d.juros,saldo:d.saldo,dia:d.dia,paga:!!d.paga,periodicidade:d.periodicidade||'mensal'}))
  ]);
}
function totalMes(){return itens().reduce((s,i)=>s+(i.kind==='divida'&&i.periodicidade==='anual'?0:i.valor),0);}
function falta(){return itens().filter(i=>!i.paga).reduce((s,i)=>s+(i.kind==='divida'&&i.periodicidade==='anual'?0:i.valor),0);}
function parcelasMensais(){return db.dividas.reduce((s,d)=>s+(d.periodicidade==='anual'?0:d.parcela),0);}
function parcelasAnuais(){return db.dividas.reduce((s,d)=>s+(d.periodicidade==='anual'?d.parcela:0),0);}
function totalDividas(){return db.dividas.reduce((s,d)=>s+d.saldo,0);}
function parcelasDividasMes(){return db.dividas.reduce((s,d)=>s+d.parcela,0);}
function ifoodLiquido(){return db.ifood.reduce((s,r)=>s+(r.bruto-r.moto),0);}
function rendaRecebida(){return db.salario+db.esposa+ifoodLiquido();}
function sobra(){return rendaRecebida()-totalMes()-jurosMes();}
function jurosMes(){return [...db.contas,...db.dividas].reduce((s,i)=>s+(i.paga?Number(i.juros||0):0),0);}
function gastoRealMes(){return [...db.contas,...db.dividas].reduce((s,i)=>{if(i.periodicidade==='anual')return s;const previsto=i.parcela!=null?i.parcela:i.valor;return s+(i.paga&&i.valorPago!=null?Number(i.valorPago):Number(previsto||0));},0);}
function sobraReal(){return rendaRecebida()-gastoRealMes();}
function pctPago(){const t=totalMes();return t?Math.round((t-falta())/t*100):0;}
function progressoDivida(d){
  const total=d.total||d.saldo||0;
  const pago=Math.max(0,total-d.saldo);
  const pct=total?Math.min(100,Math.max(0,Math.round(pago/total*100))):0;
  return {total,pct};
}

function status(i){if(i.paga)return ['Paga','ok'];return [prazo(i.dia),classePrazo(i.dia)];}

function linha(i){
  const st=status(i);
  const temPagamento=i.paga&&i.valorPago!=null;
  const pagamento=i.kind==='divida'?'Saldo devedor '+brl(i.saldo):'Conta do mês';
  const detalhePagamento=temPagamento?`<p class="payment-detail">Valor original: ${brl(i.valor)}${Number(i.juros||0)>0?` · Juros: ${brl(i.juros)}`:Number(i.valorPago)<Number(i.valor)?` · Abaixo do previsto: ${brl(Number(i.valor)-Number(i.valorPago))}`:''}</p>`:'';
  const valorExibido=temPagamento?Number(i.valorPago):Number(i.valor);
  return `<div class="item ${i.paga?'paid':''}">
    <button class="pagar ${i.paga?'on':''}" type="button" data-act="toggle" data-kind="${i.kind}" data-id="${i.id}" aria-pressed="${i.paga}"><span class="box">${i.paga?'✓':''}</span>Pago</button>
    <div class="info"><p class="nome">${esc(i.nome)}</p><p class="det"><span class="pill ${st[1]}">${st[0]}</span>${pagamento}</p>${detalhePagamento}</div>
    <span class="valor ${temPagamento?'real-payment':''}">${brl(valorExibido)}</span>
    <button class="del" type="button" data-act="del" data-kind="${i.kind}" data-id="${i.id}" aria-label="Apagar">Apagar</button>
  </div>`;
}

function linhaDivida(d){
  const st=status({paga:d.paga,dia:d.dia});
  const p=progressoDivida(d);
  const temPagamento=d.paga&&d.valorPago!=null;
  const pagamento=`Parcela ${brl(d.parcela)} · ${d.periodicidade==='anual'?'anual':'mensal'}`;
  const detalhePagamento=temPagamento?`<p class="payment-detail">Valor original: ${brl(d.parcela)}${Number(d.juros||0)>0?` · Juros: ${brl(d.juros)}`:Number(d.valorPago)<Number(d.parcela)?` · Abaixo do previsto: ${brl(Number(d.parcela)-Number(d.valorPago))}`:''}</p>`:'';
  const valorExibido=temPagamento?Number(d.valorPago):Number(d.parcela);
  return `<div class="item ${d.paga?'paid':''}">
    <button class="pagar ${d.paga?'on':''}" type="button" data-act="toggle" data-kind="divida" data-id="${d.id}" aria-pressed="${d.paga}"><span class="box">${d.paga?'✓':''}</span>Pago</button>
    <div class="info"><p class="nome">${esc(d.nome)}</p><p class="det"><span class="pill ${st[1]}">${st[0]}</span>${pagamento}</p>${detalhePagamento}</div>
    <span class="valor ${temPagamento?'real-payment':''}">${brl(valorExibido)}</span>
    <button class="del" type="button" data-act="del" data-kind="divida" data-id="${d.id}" aria-label="Apagar">Apagar</button>
    <div style="width:100%;margin-top:8px">
      <div class="topo"><span>Já pagou ${p.pct}% de ${brl(p.total)}</span><span>Falta ${brl(d.saldo)}</span></div>
      <div class="bar"><div style="width:${p.pct}%"></div></div>
    </div>
    <form data-form="saldo" data-id="${d.id}" style="grid-template-columns:1fr 1fr;width:100%;margin:8px 0 0">
      <label class="campo">Valor original (R$)<input name="total" inputmode="decimal" value="${p.total}" required></label>
      <label class="campo">Saldo total que ainda falta pagar (R$)<input name="saldo" inputmode="decimal" value="${d.saldo}" required></label>
      <button class="btn small" type="submit" style="grid-column:1 / -1">Atualizar</button>
    </form>
  </div>`;
}

function listaIfood(){
  if(!db.ifood.length) return '<p class="empty">Nenhum dia registrado ainda.</p>';
  return [...db.ifood].sort((a,b)=>b.data.localeCompare(a.data)).map(r=>`<div class="item">
    <div class="info"><p class="nome">${dataBR(r.data)}</p><p class="det">Rodou ${brl(r.bruto)} · moto ${brl(r.moto)}</p></div>
    <span class="valor">${brl(r.bruto-r.moto)}</span>
    <button class="btn ghost small" type="button" data-act="editar-ifood" data-id="${r.id}">Editar</button>
    <button class="del" type="button" data-act="del" data-kind="ifood" data-id="${r.id}" aria-label="Apagar">Apagar</button>
  </div>`).join('');
}

function itemIcon(i){const n=String(i.nome||'').toLowerCase();if(n.includes('moto')||n.includes('carro'))return '<svg viewBox="0 0 24 24"><path d="M5 16a3 3 0 1 0 0 1m14-1a3 3 0 1 0 0 1M8 16h8l-2-6h-3l-2 3h5M6 10h4"/></svg>';if(n.includes('ração')||n.includes('comida')||n.includes('mercado'))return '<svg viewBox="0 0 24 24"><path d="M6 4v7m3-7v7m-1.5-7v16M15 4v16m0-9c2-1 3-3 3-7"/></svg>';return '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M7 9h10M8 14h2"/></svg>';}
function miniFoto(slot,fallback){const x=db.perfil&&db.perfil[slot];return x&&x.foto?`<img class="brand-avatar" src="${esc(x.foto)}" alt="">`:`<div class="brand-avatar">${fallback}</div>`;}
function renderHome(){
  const lista=itens();const proximos=lista.filter(i=>!i.paga).slice(0,3);const total=totalMes(),pagos=Math.max(0,total-falta()),percentual=total?Math.round(pagos/total*100):0,pendentePct=total?Math.round(falta()/total*100):0;const salarios=Number(db.salario||0)+Number(db.esposa||0),ifood=ifoodLiquido(),rendaTotal=salarios+ifood,juros=jurosMes(),saldoPrevisto=sobraReal(),forecastState=saldoPrevisto>0?'positive':saldoPrevisto<0?'negative':'neutral',forecastSymbol=saldoPrevisto>0?'＋':saldoPrevisto<0?'−':'＝',forecastText=saldoPrevisto<0?`Atenção: faltam ${brl(Math.abs(saldoPrevisto))} para cobrir os compromissos.`:saldoPrevisto>0?'Vocês estão dentro do orçamento do mês.':'A renda cobre exatamente os compromissos do mês.';
  const proximosHtml=proximos.length?proximos.map(i=>`<div class="next-row"><div class="topic-icon">${itemIcon(i)}</div><div><p class="nome">${esc(i.nome)}</p><p class="det"><span class="pill ${classePrazo(i.dia)}">${prazo(i.dia)}</span> ${brl(i.valor)}</p></div><span class="valor">${brl(i.valor)}</span><span class="next-arrow">›</span></div>`).join(''):'<p class="empty ok">Tudo pago neste mês</p>';
  document.getElementById('home').innerHTML=`
    <div class="app-brand"><div class="brand-mark"><div class="brand-hearts">♡♡</div><div><div class="brand-name">Contas do casal</div><div class="brand-sub">Juntos por grandes planos</div></div></div>${miniFoto('voce','V')}</div>
    <div class="card money-card"><div class="topic-icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M7 10h10M8 15h3"/></svg></div><div class="money-copy"><p class="lbl">Renda total do mês</p><p class="val">${brl(rendaTotal)}</p><p class="sub">Salários do casal: ${brl(salarios)} · iFood líquido: ${brl(ifood)}</p></div><div class="money-side">Juntos<br>vamos mais longe<br><strong>♥</strong></div></div>
    <div class="card next-card"><div class="section-head"><div class="topic-icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></div><h2>Próximos vencimentos</h2><button class="section-link link-button" type="button" data-act="ver-todos">Ver todos →</button></div>${proximosHtml}</div>
    <div class="card forecast-card ${forecastState}"><div class="forecast-symbol">${forecastSymbol}</div><div><p class="lbl">Saldo previsto após pagar tudo</p><div class="forecast-value">${saldoPrevisto<0?'− ':saldoPrevisto>0?'＋ ':''}${brl(Math.abs(saldoPrevisto))}</div><p class="sub">${forecastText}</p></div></div>
    <div class="grid2"><div class="tile bad metric-card"><div class="topic-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16v1"/></svg></div><p class="lbl">Falta pagar no mês</p><p class="val2">${brl(falta())}</p><p class="sub">Contas que vencem neste mês.</p></div><div class="tile warn metric-card"><div class="topic-icon"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="6" ry="3"/><path d="M6 7v5c0 2 12 2 12 0V7M6 12v5c0 2 12 2 12 0v-5"/></svg></div><p class="lbl">Dívida total restante</p><p class="val2">${brl(totalDividas())}</p><p class="sub">Valor total que ainda falta quitar.</p></div></div>
    <div class="card"><div class="row between"><span class="lbl">Juros pagos no mês</span><strong>${brl(juros)}</strong></div><div class="row between" style="margin-top:8px"><span class="lbl">Sobra real do mês</span><strong class="${sobraReal()<0?'bad':''}">${brl(sobraReal())}</strong></div><p class="sub">A sobra considera o valor realmente pago; a falta pagar e o progresso usam o valor previsto.</p></div>
    <div class="card progress-card"><div class="section-head"><div class="topic-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="m15 9 4-4M17 5h2v2"/></svg></div><h2>Progresso do mês</h2><span class="section-link">Até o fim do mês ›</span></div><div class="progress-layout"><div class="progress-ring" style="--progress:${percentual}%"><b>${percentual}%</b></div><div class="progress-copy"><strong>${brl(pagos)} pagos</strong><p>de ${brl(total)} previstos</p><div class="bar"><div style="width:${percentual}%"></div></div><div class="trophy-note">🏆 Mandaram bem! ${percentual}% das contas já foram pagas.</div></div></div></div>
    <div class="card"><div class="row between"><span class="lbl">Parcelas mensais</span><strong>${brl(parcelasMensais())}</strong></div><div class="row between" style="margin-top:8px"><span class="lbl">Parcelas anuais cadastradas</span><strong>${brl(parcelasAnuais())}</strong></div><p class="sub">No orçamento mensal entram somente as dívidas marcadas como mensais.</p></div>
    <h2 id="todas-contas">Contas e parcelas do mês</h2><div class="card">${lista.length?lista.map(linha).join(''):'<p class="empty">Nenhuma conta cadastrada ainda.</p>'}</div>`;
}

}

function renderPerfil(){const p=db.perfil||{};const voce=p.voce||{nome:'Você',foto:''},esposa=p.esposa||{nome:'Sua esposa',foto:''};const avatar=(x,n)=>x.foto?`<img class="avatar" src="${esc(x.foto)}" alt="Foto de ${n}">`:`<div class="avatar">${n.slice(0,1).toUpperCase()}</div>`;document.getElementById('perfil').innerHTML=`<h2>Perfil do casal</h2><p class="sub">Personalize o espaço de vocês com nomes e fotos.</p><div class="profile-grid"><div class="profile-card">${avatar(voce,'você')}<div><strong>${esc(voce.nome||'Você')}</strong><div class="badge-line">Seu perfil</div></div><form data-form="perfil" data-slot="voce"><input name="nome" value="${esc(voce.nome||'Você')}" placeholder="Seu nome ou apelido"><input name="foto" type="file" accept="image/*"><button class="btn small" type="submit">Alterar foto e nome</button></form></div><div class="profile-card">${avatar(esposa,'sua esposa')}<div><strong>${esc(esposa.nome||'Sua esposa')}</strong><div class="badge-line">Perfil da sua esposa</div></div><form data-form="perfil" data-slot="esposa"><input name="nome" value="${esc(esposa.nome||'Sua esposa')}" placeholder="Nome ou apelido"><input name="foto" type="file" accept="image/*"><button class="btn small" type="submit">Alterar foto e nome</button></form></div><button class="btn ghost" type="button" data-tab="historico">Consultar histórico mensal</button></div>`;}
function renderHistorico(){const h=Array.isArray(db.historico)?db.historico.slice().sort((a,b)=>b.mes.localeCompare(a.mes)):[];document.getElementById('historico').innerHTML=`<h2>Histórico mensal</h2><div class="card">${h.length?h.map(m=>`<div class="item"><div class="info"><p class="nome">${esc(m.mes)}</p><p class="det">Registrado em ${dataBR(m.data)} · Juros pagos ${brl(m.itens.reduce((s,i)=>s+Number(i.juros||0),0))}</p></div><span class="valor">${m.itens.filter(i=>i.paga).length} pagos</span></div>`).join(''):'<p class="empty">Nenhum mês fechado ainda.</p>'}</div>`;}
function mesesExportaveis(){return [...new Set([mesAtual(),...(db.historico||[]).map(x=>x.mes)])].sort().reverse();}
function dadosDoMes(mes){if(mes===mesAtual())return [...db.contas.map(c=>({tipo:'Conta',nome:c.nome,valor:c.valor,valorPago:c.valorPago??'',juros:c.juros||0,paga:!!c.paga,dia:c.dia,saldo:''})),...db.dividas.map(d=>({tipo:'Dívida',nome:d.nome,valor:d.parcela,valorPago:d.valorPago??'',juros:d.juros||0,paga:!!d.paga,dia:d.dia,saldo:d.saldo}))];const h=(db.historico||[]).find(x=>x.mes===mes);return h?h.itens.map(i=>({tipo:i.tipo==='divida'?'Dívida':'Conta',nome:i.nome,valor:i.valor,valorPago:i.valorPago??'',juros:i.juros||0,paga:!!i.paga,dia:i.dia||'',saldo:i.saldo??''})):[];}
function escCsv(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
function baixarMes(mes){const itens=dadosDoMes(mes),linhas=[['Tipo','Nome','Valor previsto','Valor pago','Juros','Pago','Dia de vencimento','Saldo devedor'],...itens.map(i=>[i.tipo,i.nome,brl(i.valor),i.valorPago===''?'':brl(i.valorPago),brl(i.juros),i.paga?'Sim':'Não',i.dia,i.saldo=== ''?'':brl(i.saldo)])];const csv='\\ufeff'+linhas.map(l=>l.map(escCsv).join(';')).join('\\r\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='contas-do-casal-'+mes+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function renderExportar(){const meses=mesesExportaveis();document.getElementById('exportar').innerHTML=`<h2>Exportar mês</h2><p class="sub">Baixe uma planilha compatível com Excel e Google Planilhas para guardar o fechamento do casal.</p><div class="card"><label class="campo">Escolha o mês<select id="export-mes">${meses.map(m=>`<option value="${m}">${m}${m===mesAtual()?' (mês atual)':''}</option>`).join('')}</select></label><button class="btn" type="button" data-act="exportar">Baixar planilha do mês</button></div><div class="tile ok"><p class="lbl">O arquivo inclui</p><p class="sub">Contas, dívidas, valores, situação de pagamento, vencimentos e saldo devedor quando disponível.</p></div>`;}
function mostrar(){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===aba)));['home','renda','contas','dividas','historico','exportar'].forEach(id=>{document.getElementById(id).hidden=(id!==aba);});}

function atualizar(){renderHome();renderRenda();renderContas();renderDividas();renderHistorico();renderExportar();mostrar();}
function salvarTudo(){save();atualizar();}
function prepararEstrutura(){if(!Array.isArray(db.historico))db.historico=[];if(!db.descontos||typeof db.descontos!=='object')db.descontos={};}
function virarMesSeNecessario(){prepararEstrutura();const atual=mesAtual();if(!db.mesAtual){db.mesAtual=atual;return false;}if(db.mesAtual===atual)return false;db.historico.push({mes:db.mesAtual,data:hoje(),itens:[...db.contas.map(c=>({tipo:'conta',id:c.id,nome:c.nome,valor:c.valor,valorPago:c.valorPago??'',juros:c.juros||0,paga:!!c.paga})),...db.dividas.map(d=>({tipo:'divida',id:d.id,nome:d.nome,valor:d.parcela,valorPago:d.valorPago??'',juros:d.juros||0,saldo:d.saldo,paga:!!d.paga}))]});[...db.contas,...db.dividas].forEach(i=>{i.paga=false;delete i.valorPago;delete i.juros;delete i.mesPagamento;});db.mesAtual=atual;return true;}
function mesDescontado(id,mes=mesAtual()){return Array.isArray(db.descontos[id])&&db.descontos[id].includes(mes);}
function registrarDesconto(d,mes=mesAtual()){prepararEstrutura();if(!mesDescontado(d.id,mes)){d.saldo=Math.max(0,Number(d.saldo||0)-Number(d.parcela||0));db.descontos[d.id]=[...(db.descontos[d.id]||[]),mes];}}
function desfazerDesconto(d,mes=mesAtual()){prepararEstrutura();if(mesDescontado(d.id,mes)){d.saldo=Number(d.saldo||0)+Number(d.parcela||0);db.descontos[d.id]=db.descontos[d.id].filter(x=>x!==mes);}}
function pedirValorPago(nome,previsto){return new Promise(resolve=>{const modal=document.getElementById('pay-modal'),input=document.getElementById('pay-modal-value');document.getElementById('pay-modal-title').textContent='Registrar pagamento';document.getElementById('pay-modal-copy').textContent=`${nome} · previsto ${brl(previsto)}`;input.value=String(previsto);modal.hidden=false;input.focus();const fechar=valor=>{modal.hidden=true;document.getElementById('pay-cancel').onclick=null;document.getElementById('pay-confirm').onclick=null;resolve(valor);};document.getElementById('pay-cancel').onclick=()=>fechar(null);document.getElementById('pay-confirm').onclick=()=>fechar(num(input.value));input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fechar(num(input.value));}if(e.key==='Escape')fechar(null);};});}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act]');
  if(!t) return;
  if(t.dataset.tab){aba=t.dataset.tab; armado=false; mostrar(); return;}
  const act=t.dataset.act, id=t.dataset.id, kind=t.dataset.kind;
  if(act==='toggle'){
    const lista=kind==='divida'?db.dividas:db.contas;
    const it=lista.find(x=>x.id===id);
    if(it){const antes=!!it.paga;if(!antes){const previsto=kind==='divida'?Number(it.parcela||0):Number(it.valor||0);const pago=await pedirValorPago(it.nome,previsto);if(pago===null)return;it.valorPago=pago;it.juros=Math.max(0,pago-previsto);it.mesPagamento=mesAtual();it.paga=true;if(kind==='divida')registrarDesconto(it);}else{it.paga=false;delete it.valorPago;delete it.juros;delete it.mesPagamento;if(kind==='divida')desfazerDesconto(it);}}
  } else if(act==='del'){
    if(kind==='ifood') db.ifood=db.ifood.filter(x=>x.id!==id);
    else if(kind==='divida') db.dividas=db.dividas.filter(x=>x.id!==id);
    else db.contas=db.contas.filter(x=>x.id!==id);
  } else if(act==='zerar'){
    db.contas.forEach(c=>{c.paga=false;});
    db.dividas.forEach(d=>{d.paga=false;});
  } else if(act==='apagar'){
    if(!armado){armado=true; atualizar(); return;}
    db=JSON.parse(JSON.stringify(vazio));
    armado=false;
  } else if(act==='exportar'){
    baixarMes(document.getElementById('export-mes').value);
    return;
  } else if(act==='editar-ifood'){
    const r=db.ifood.find(x=>x.id===id);
    if(r){
      const data=window.prompt('Data (AAAA-MM-DD):',r.data); if(data===null)return;
      const bruto=window.prompt('Valor rodado (R$):',String(r.bruto)); if(bruto===null)return;
      const moto=window.prompt('Gasto com a moto (R$):',String(r.moto)); if(moto===null)return;
      r.data=data||r.data; r.bruto=num(bruto); r.moto=num(moto);
    }
  } else if(act==='ver-todos'){
    document.getElementById('todas-contas')?.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  salvarTudo();
});

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target;
  const d=new FormData(f);
  const tipo=f.dataset.form;
  if(tipo==='perfil'){
    prepararEstrutura();if(!db.perfil)db.perfil={voce:{nome:'Você',foto:''},esposa:{nome:'Sua esposa',foto:''}};const slot=String(f.dataset.slot);const atual=db.perfil[slot]||{nome:'',foto:''};atual.nome=String(d.get('nome')||atual.nome).trim()||atual.nome;const arquivo=d.get('foto');if(arquivo&&arquivo.name&&window.__supabaseClient&&window.__supabaseUser){const path=window.__supabaseUser.id+'/'+slot+'-'+Date.now()+'.'+(arquivo.name.split('.').pop()||'jpg');const up=await window.__supabaseClient.storage.from('couple-profile').upload(path,arquivo,{upsert:true,contentType:arquivo.type||'image/jpeg'});if(up.error){alert('Não foi possível enviar a foto agora.');return;}atual.foto=window.__supabaseClient.storage.from('couple-profile').getPublicUrl(path).data.publicUrl;}db.perfil[slot]=atual;
  } else if(tipo==='config'){
    db.salario=num(d.get('salario'));
    db.esposa=num(d.get('esposa'));
    db.saldo=db.salario+db.esposa;
  } else if(tipo==='ifood'){
    db.ifood.push({id:uid(),data:String(d.get('data')||hoje()),bruto:num(d.get('bruto')),moto:num(d.get('moto'))});
  } else if(tipo==='conta'){
    db.contas.push({id:uid(),nome:String(d.get('nome')).trim(),valor:num(d.get('valor')),dia:diaValido(d.get('dia')),paga:false});
  } else if(tipo==='divida'){
    const saldo=num(d.get('saldo'));
    const total=num(d.get('total'))||saldo;
    db.dividas.push({id:uid(),nome:String(d.get('nome')).trim(),total:total,parcela:num(d.get('parcela')),periodicidade:String(d.get('periodicidade')||'mensal'),saldo:saldo,dia:diaValido(d.get('dia')),paga:false});
  } else if(tipo==='saldo'){
    const it=db.dividas.find(x=>x.id===f.dataset.id);
    if(it){
      it.saldo=num(d.get('saldo'));
      it.total=num(d.get('total'))||it.total||it.saldo;
      it.periodicidade=String(d.get('periodicidade')||it.periodicidade||'mensal');
    }
  }
  salvarTudo();
});
