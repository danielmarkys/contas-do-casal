<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Contas do casal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
#auth{position:fixed;inset:0;background:var(--bg);z-index:10;display:grid;place-items:center;padding:20px}
#auth .auth-card{width:min(100%,420px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
#auth h1{margin-bottom:6px}.auth-help{color:var(--muted);font-size:14px;margin:0 0 16px}
#auth-msg{min-height:20px;color:var(--bad);font-size:14px}.auth-links{margin-top:12px;text-align:center}
#auth-links button{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline}
#logout{float:right;margin-top:-4px}
</style>
<style>
:root{--bg:#f5f4f0;--card:#ffffff;--fg:#1c1c1a;--muted:#6b6a65;--line:#e2e0d9;--accent:#2f6fd6;--on-accent:#ffffff;--ok:#1f7a4a;--ok-bg:#e3f3ea;--bad:#b42f2f;--bad-bg:#fbe5e5;--warn:#8a5a0b;--warn-bg:#fcefd2;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161614;--card:#222220;--fg:#f1f0ec;--muted:#a09f99;--line:#3a3a36;--accent:#6d9cf0;--on-accent:#101418;--ok:#7fd8a4;--ok-bg:#1d3527;--bad:#f28b8b;--bad-bg:#3d2323;--warn:#f0c86e;--warn-bg:#3b3019;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161614;--card:#222220;--fg:#f1f0ec;--muted:#a09f99;--line:#3a3a36;--accent:#6d9cf0;--on-accent:#101418;--ok:#7fd8a4;--ok-bg:#1d3527;--bad:#f28b8b;--bad-bg:#3d2323;--warn:#f0c86e;--warn-bg:#3b3019;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0 0 12px;font-weight:600}
h2{font-size:17px;margin:20px 0 8px;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;min-width:0;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.tile{border-radius:14px;padding:14px;margin-bottom:10px;min-width:0}
.bad{background:var(--bad-bg);color:var(--bad)}
.warn{background:var(--warn-bg);color:var(--warn)}
.ok{background:var(--ok-bg);color:var(--ok)}
.lbl{margin:0;font-size:13px;color:var(--muted)}
.bad .lbl,.warn .lbl,.ok .lbl{color:inherit}
.val{margin:4px 0 0;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.val2{margin:4px 0 0;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.sub{margin:6px 0 0;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar div{height:100%;background:var(--ok)}
form{display:grid;gap:8px;margin-bottom:12px}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);width:100%;min-width:0}
.btn{font:inherit;font-size:15px;padding:11px 14px;border-radius:10px;border:none;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:9px 10px;font-size:14px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:none}
.item.paid{background:var(--ok-bg);border-radius:10px;padding:10px;border-bottom:none;margin-bottom:6px}
.item.paid .nome,.item.paid .valor{color:var(--ok)}
.item .info{flex:1;min-width:0}
.item .nome{margin:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .det{margin:2px 0 0;font-size:13px;color:var(--muted)}
.item .valor{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pill{font-size:12px;padding:2px 8px;border-radius:8px;white-space:nowrap;margin-right:4px}
.neu{background:var(--line);color:var(--muted)}
.pagar{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--fg);font:inherit;font-size:14px;cursor:pointer;padding:4px 2px;flex:none}
.pagar.on{color:var(--ok);font-weight:600}
.box{width:24px;height:24px;border-radius:6px;border:2px solid var(--muted);background:var(--card);color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;flex:none}
.pagar.on .box{background:var(--ok);border-color:var(--ok)}
.topo{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.del{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px}
.empty{color:var(--muted);font-size:14px;margin:8px 0}
.campo{display:grid;gap:4px;font-size:13px;color:var(--muted)}
</style>

<div id="auth" hidden>
  <div class="auth-card">
    <h1 id="auth-title">Entrar</h1>
    <p class="auth-help">Use o mesmo acesso nos dois celulares. No primeiro uso, crie uma conta gratuita para o casal.</p>
    <form id="auth-form">
      <input id="auth-email" type="email" placeholder="E-mail" autocomplete="email" required>
      <input id="auth-password" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password" minlength="6" required>
      <button class="btn" type="submit" id="auth-submit">Entrar</button>
    </form>
    <p id="auth-msg"></p>
    <div class="auth-links"><button type="button" id="auth-toggle">Primeiro acesso? Criar conta</button></div>
  </div>
</div>
<h1>Contas do casal <button class="btn ghost small" id="logout" type="button">Sair</button></h1>
<div class="tabs">
<button type="button" data-tab="home" aria-pressed="true">Início</button>
<button type="button" data-tab="renda" aria-pressed="false">Renda</button>
<button type="button" data-tab="contas" aria-pressed="false">Contas</button>
<button type="button" data-tab="dividas" aria-pressed="false">Dívidas</button>
</div>
<section id="home"></section>
<section id="renda" hidden></section>
<section id="contas" hidden></section>
<section id="dividas" hidden></section>

<script>
const KEY='contas-casal-basico-v1';
const vazio={salario:0,esposa:0,saldo:0,contas:[],dividas:[],ifood:[]};
let db=load();
let armado=false;
let aba='home';

function load(){
  try{const s=localStorage.getItem(KEY); if(s) return Object.assign({},JSON.parse(JSON.stringify(vazio)),JSON.parse(s));}catch(e){}
  return JSON.parse(JSON.stringify(vazio));
}
async function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
  if(window.__supabaseUser && window.__supabaseClient){
    const {error}=await window.__supabaseClient.from('couple_finance_data').upsert({id:'shared',data:db,updated_at:new Date().toISOString(),updated_by:window.__supabaseUser.id});
    if(error) console.error(error);
  }
}
function num(v){
  let s=String(v||'').trim();
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}
function brl(n){return 'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function hoje(){const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function diaHoje(){return new Date().getDate();}
function diaValido(v){const n=parseInt(v,10);return n>=1&&n<=31?n:1;}
function dataBR(s){const p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]:s;}

function itens(){
  return [
    ...db.contas.map(c=>({kind:'conta',id:c.id,nome:c.nome,valor:c.valor,dia:c.dia,paga:!!c.paga})),
    ...db.dividas.map(d=>({kind:'divida',id:d.id,nome:d.nome,valor:d.parcela,saldo:d.saldo,dia:d.dia,paga:!!d.paga,periodicidade:d.periodicidade||'mensal'}))
  ].sort((a,b)=>a.dia-b.dia);
}
function totalMes(){return itens().reduce((s,i)=>s+(i.kind==='divida'&&i.periodicidade==='anual'?0:i.valor),0);}
function falta(){return itens().filter(i=>!i.paga).reduce((s,i)=>s+(i.kind==='divida'&&i.periodicidade==='anual'?0:i.valor),0);}
function parcelasMensais(){return db.dividas.reduce((s,d)=>s+(d.periodicidade==='anual'?0:d.parcela),0);}
function parcelasAnuais(){return db.dividas.reduce((s,d)=>s+(d.periodicidade==='anual'?d.parcela:0),0);}
function totalDividas(){return db.dividas.reduce((s,d)=>s+d.saldo,0);}
function parcelasDividasMes(){return db.dividas.reduce((s,d)=>s+d.parcela,0);}
function ifoodLiquido(){return db.ifood.reduce((s,r)=>s+(r.bruto-r.moto),0);}
function rendaRecebida(){return db.salario+db.esposa+ifoodLiquido();}
function sobra(){return rendaRecebida()-totalMes();}
function pctPago(){const t=totalMes();return t?Math.round((t-falta())/t*100):0;}
function progressoDivida(d){
  const total=d.total||d.saldo||0;
  const pago=Math.max(0,total-d.saldo);
  const pct=total?Math.min(100,Math.max(0,Math.round(pago/total*100))):0;
  return {total,pct};
}

function status(i){
  if(i.paga) return ['Paga','ok'];
  const diff=i.dia-diaHoje();
  if(diff<0) return ['Vencida','bad'];
  if(diff===0) return ['Vence hoje','warn'];
  if(diff<=3) return ['Vence em '+diff+(diff===1?' dia':' dias'),'warn'];
  return ['Vence dia '+i.dia,'neu'];
}

function linha(i){
  const st=status(i);
  const det=i.kind==='divida'?'Saldo devedor '+brl(i.saldo):'Conta do mês';
  return `<div class="item ${i.paga?'paid':''}">
    <button class="pagar ${i.paga?'on':''}" type="button" data-act="toggle" data-kind="${i.kind}" data-id="${i.id}" aria-pressed="${i.paga}"><span class="box">${i.paga?'✓':''}</span>Pago</button>
    <div class="info"><p class="nome">${esc(i.nome)}</p><p class="det"><span class="pill ${st[1]}">${st[0]}</span>${det}</p></div>
    <span class="valor">${brl(i.valor)}</span>
    <button class="del" type="button" data-act="del" data-kind="${i.kind}" data-id="${i.id}" aria-label="Apagar">Apagar</button>
  </div>`;
}

function linhaDivida(d){
  const st=status({paga:d.paga,dia:d.dia});
  const p=progressoDivida(d);
  return `<div class="item ${d.paga?'paid':''}">
    <button class="pagar ${d.paga?'on':''}" type="button" data-act="toggle" data-kind="divida" data-id="${d.id}" aria-pressed="${d.paga}"><span class="box">${d.paga?'✓':''}</span>Pago</button>
    <div class="info"><p class="nome">${esc(d.nome)}</p><p class="det"><span class="pill ${st[1]}">${st[0]}</span>Parcela ${brl(d.parcela)} · ${d.periodicidade==='anual'?'anual':'mensal'}</p></div>
    <button class="del" type="button" data-act="del" data-kind="divida" data-id="${d.id}" aria-label="Apagar">Apagar</button>
    <div style="width:100%;margin-top:8px">
      <div class="topo"><span>Já pagou ${p.pct}% de ${brl(p.total)}</span><span>Falta ${brl(d.saldo)}</span></div>
      <div class="bar"><div style="width:${p.pct}%"></div></div>
    </div>
    <form data-form="saldo" data-id="${d.id}" style="grid-template-columns:1fr 1fr;width:100%;margin:8px 0 0">
      <label class="campo">Valor original (R$)<input name="total" inputmode="decimal" value="${p.total}" required></label>
      <label class="campo">Saldo total que ainda falta pagar (R$)<input name="saldo" inputmode="decimal" value="${d.saldo}" required></label>
      <button class="btn small" type="submit" style="grid-column:1 / -1">Atualizar</button>
    </form>
  </div>`;
}

function listaIfood(){
  if(!db.ifood.length) return '<p class="empty">Nenhum dia registrado ainda.</p>';
  return [...db.ifood].sort((a,b)=>b.data.localeCompare(a.data)).map(r=>`<div class="item">
    <div class="info"><p class="nome">${dataBR(r.data)}</p><p class="det">Rodou ${brl(r.bruto)} · moto ${brl(r.moto)}</p></div>
    <span class="valor">${brl(r.bruto-r.moto)}</span>
    <button class="del" type="button" data-act="del" data-kind="ifood" data-id="${r.id}" aria-label="Apagar">Apagar</button>
  </div>`).join('');
}

function renderHome(){
  const lista=itens();
  document.getElementById('home').innerHTML=`
    <div class="card"><p class="lbl">Dinheiro em conta</p><p class="val">${brl(db.saldo)}</p><p class="sub">Total de todos os bancos e carteira. Você atualiza na aba Renda.</p></div>
    <div class="grid2">
      <div class="tile bad"><p class="lbl">Falta pagar no mês</p><p class="val2">${brl(falta())}</p></div>
      <div class="tile warn"><p class="lbl">Dívida total restante</p><p class="val2">${brl(totalDividas())}</p><p class="sub">Valor total que ainda falta quitar nos financiamentos e dívidas.</p></div>
    </div>
    <div class="card"><div class="row between"><span class="lbl">Parcelas mensais</span><strong>${brl(parcelasMensais())}</strong></div><div class="row between" style="margin-top:8px"><span class="lbl">Parcelas anuais cadastradas</span><strong>${brl(parcelasAnuais())}</strong></div><p class="sub">No orçamento mensal entram somente as dívidas marcadas como mensais.</p></div>
    <div class="tile ${sobra()<0?'bad':'ok'}"><p class="lbl">Sobra do mês</p><p class="val2">${brl(sobra())}</p><p class="sub">Renda recebida menos todas as contas e parcelas do mês.</p></div>
    <div class="card"><div class="row between"><span class="lbl">Contas do mês já pagas</span><span>${pctPago()}%</span></div><div class="bar"><div style="width:${pctPago()}%"></div></div></div>
    <h2>Contas e parcelas do mês</h2>
    <div class="card">${lista.length?lista.map(linha).join(''):'<p class="empty">Nenhuma conta cadastrada ainda. Adicione na aba Contas ou Dívidas.</p>'}</div>`;
}

function renderRenda(){
  document.getElementById('renda').innerHTML=`
    <h2>Entradas</h2>
    <div class="card"><form data-form="config">
      <label class="lbl" for="f-sal">Seu salário líquido (R$)</label>
      <input id="f-sal" name="salario" inputmode="decimal" value="${db.salario||''}" placeholder="Ex.: 1518">
      <label class="lbl" for="f-esp">Renda da esposa (R$)</label>
      <input id="f-esp" name="esposa" inputmode="decimal" value="${db.esposa||''}" placeholder="Ex.: 1800">
      <label class="lbl" for="f-saldo">Dinheiro total nos bancos e carteira (R$)</label>
      <input id="f-saldo" name="saldo" inputmode="decimal" value="${db.saldo||''}" placeholder="Ex.: 950">
      <button class="btn" type="submit">Salvar</button>
    </form></div>
    <h2>iFood: dias rodados</h2>
    <div class="card"><form data-form="ifood">
      <label class="lbl" for="f-data">Dia</label>
      <input id="f-data" name="data" type="date" value="${hoje()}" required>
      <label class="lbl" for="f-bruto">Quanto rodou no dia (R$)</label>
      <input id="f-bruto" name="bruto" inputmode="decimal" placeholder="Ex.: 100" required>
      <label class="lbl" for="f-moto">Gasto com a moto no dia (R$)</label>
      <input id="f-moto" name="moto" inputmode="decimal" placeholder="Ex.: 20">
      <button class="btn" type="submit">Adicionar dia</button>
    </form>
    ${listaIfood()}
    <p class="sub">Líquido do iFood: <strong>${brl(ifoodLiquido())}</strong></p>
    </div>
    <div class="tile ok"><p class="lbl">Renda recebida no mês</p><p class="val2">${brl(rendaRecebida())}</p><p class="sub">Salário, renda da esposa e iFood líquido.</p></div>
    <div class="card"><button class="btn ghost" type="button" data-act="apagar">${armado?'Toque de novo para apagar tudo':'Apagar tudo'}</button></div>`;
}

function renderContas(){
  const contas=db.contas.map(c=>({kind:'conta',id:c.id,nome:c.nome,valor:c.valor,dia:c.dia,paga:!!c.paga})).sort((a,b)=>a.dia-b.dia);
  document.getElementById('contas').innerHTML=`
    <h2>Adicionar conta</h2>
    <div class="card"><form data-form="conta">
      <input name="nome" placeholder="Nome (ex.: Luz, Aluguel, Ração)" required>
      <input name="valor" inputmode="decimal" placeholder="Valor (R$)" required>
      <input name="dia" inputmode="numeric" placeholder="Dia do vencimento (1 a 31)" required>
      <button class="btn" type="submit">Adicionar conta</button>
    </form></div>
    <h2>Contas do mês</h2>
    <div class="card">${contas.length?contas.map(linha).join(''):'<p class="empty">Nenhuma conta ainda.</p>'}</div>
    <div class="card"><button class="btn ghost small" type="button" data-act="zerar">Desmarcar todas como pagas (novo mês)</button></div>`;
}

function renderDividas(){
  const dv=db.dividas.slice().sort((a,b)=>a.dia-b.dia);
  document.getElementById('dividas').innerHTML=`
    <h2>Adicionar dívida</h2>
    <div class="card"><form data-form="divida">
      <input name="nome" placeholder="Nome (ex.: Moto, Empréstimo, Cartão Visa)" required>
      <label class="campo">Valor total original da dívida (R$)<input name="total" inputmode="decimal" required></label>
      <label class="campo">Saldo total que ainda falta pagar (R$)<input name="saldo" inputmode="decimal" required></label>
      <label class="campo">Periodicidade<select name="periodicidade"><option value="mensal">Mensal</option><option value="anual">Anual</option></select></label>
      <label class="campo">Valor da parcela mensal ou anual (R$)<input name="parcela" inputmode="decimal" required></label>
      <label class="campo">Dia do vencimento (1 a 31)<input name="dia" inputmode="numeric" required></label>
      <button class="btn" type="submit">Adicionar dívida</button>
    </form></div>
    <h2>Dívidas</h2>
    <div class="card">${dv.length?dv.map(linhaDivida).join(''):'<p class="empty">Nenhuma dívida ainda.</p>'}</div>
    <div class="tile warn"><p class="lbl">Quanto falta para quitar</p><p class="val2">${brl(totalDividas())}</p></div>`;
}

function mostrar(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===aba)));
  ['home','renda','contas','dividas'].forEach(id=>{document.getElementById(id).hidden=(id!==aba);});
}
function atualizar(){
  renderHome(); renderRenda(); renderContas(); renderDividas(); mostrar();
}
function salvarTudo(){save(); atualizar();}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act]');
  if(!t) return;
  if(t.dataset.tab){aba=t.dataset.tab; armado=false; mostrar(); return;}
  const act=t.dataset.act, id=t.dataset.id, kind=t.dataset.kind;
  if(act==='toggle'){
    const lista=kind==='divida'?db.dividas:db.contas;
    const it=lista.find(x=>x.id===id);
    if(it) it.paga=!it.paga;
  } else if(act==='del'){
    if(kind==='ifood') db.ifood=db.ifood.filter(x=>x.id!==id);
    else if(kind==='divida') db.dividas=db.dividas.filter(x=>x.id!==id);
    else db.contas=db.contas.filter(x=>x.id!==id);
  } else if(act==='zerar'){
    db.contas.forEach(c=>{c.paga=false;});
    db.dividas.forEach(d=>{d.paga=false;});
  } else if(act==='apagar'){
    if(!armado){armado=true; atualizar(); return;}
    db=JSON.parse(JSON.stringify(vazio));
    armado=false;
  }
  salvarTudo();
});

document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  const d=new FormData(f);
  const tipo=f.dataset.form;
  if(tipo==='config'){
    db.salario=num(d.get('salario'));
    db.esposa=num(d.get('esposa'));
    db.saldo=num(d.get('saldo'));
  } else if(tipo==='ifood'){
